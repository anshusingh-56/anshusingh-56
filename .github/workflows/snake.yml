name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: anshusingh-56
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#4f8fb0&color_dots=#e1e8ee,#b8d3e5,#8fbcd8,#69a4c9,#3f86b3
            dist/github-contribution-grid-snake-dark.svg?color_snake=#8FD0EA&color_dots=#16212b,#24394a,#35607a,#4f8fb0,#74b1d7

      - name: Generate activity graph
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          sudo chown -R "$(id -u):$(id -g)" dist
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, datetime
          import re, traceback
          login = "anshusingh-56"
          def from_graphql():
              q = "query($l:String!){user(login:$l){contributionsCollection{contributionCalendar{weeks{contributionDays{contributionCount}}}}}}"
              req = urllib.request.Request("https://api.github.com/graphql", data=json.dumps({"query": q, "variables": {"l": login}}).encode(),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Content-Type": "application/json", "User-Agent": "graph"})
              r = json.load(urllib.request.urlopen(req, timeout=30))
              if "data" not in r or not r["data"] or not r["data"].get("user"):
                  raise RuntimeError("GraphQL response: " + json.dumps(r)[:300])
              cal = r["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]
              return [sum(d["contributionCount"] for d in w["contributionDays"]) for w in cal]
          def from_html():
              req = urllib.request.Request(f"https://github.com/users/{login}/contributions", headers={"User-Agent": "Mozilla/5.0"})
              html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")
              tips = {m[0]: m[1] for m in re.findall(r'<tool-tip[^>]*\bfor="([^"]+)"[^>]*>\s*([^<]*?)\s*</tool-tip>', html)}
              days = []
              for tag in re.findall(r"<td[^>]*data-date=[^>]*>", html):
                  date = re.search(r'data-date="([^"]+)"', tag).group(1)
                  i = re.search(r'\bid="([^"]+)"', tag); lv = re.search(r'data-level="(\d)"', tag)
                  tip = tips.get(i.group(1), "") if i else ""
                  m = re.match(r"(\d+)", tip)
                  cnt = int(m.group(1)) if m else (0 if tip.startswith("No") else int(lv.group(1)) if lv else 0)
                  days.append((date, cnt))
              if not days: raise RuntimeError("no contribution cells found in HTML")
              days.sort()
              return [sum(c for _, c in days[k:k + 7]) for k in range(0, len(days), 7)]
          vals = None
          if os.environ.get("MOCK"):
              import random; random.seed(1); vals = [random.choice([0, 1, 5, 9, 14]) for _ in range(53)]
          else:
              for fn in (from_graphql, from_html):
                  try:
                      vals = fn(); print("source:", fn.__name__); break
                  except Exception:
                      print("FAILED:", fn.__name__); traceback.print_exc()
              if not vals: sys.exit(1)
          total = sum(vals)
          W, H, L, R, T, B = 900, 300, 50, 30, 70, 50
          mx = max(max(vals), 1); n = len(vals)
          pts = [(L + i * (W - L - R) / (n - 1), T + (H - T - B) * (1 - v / mx)) for i, v in enumerate(vals)]
          line = "M" + " L".join(f"{x:.1f} {y:.1f}" for x, y in pts)
          area = line + f" L{pts[-1][0]:.1f} {H-B} L{pts[0][0]:.1f} {H-B}Z"
          grid = "".join(f'<line x1="{L}" x2="{W-R}" y1="{T+(H-T-B)*k/4:.0f}" y2="{T+(H-T-B)*k/4:.0f}" stroke="#24394A" stroke-opacity=".6"/>' for k in range(5))
          best = max(range(n), key=lambda i: vals[i]); bx, by = pts[best]
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}" width="{W}" height="{H}" role="img" aria-label="Contribution activity">
          <defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#74B1D7" stop-opacity=".4"/><stop offset="1" stop-color="#74B1D7" stop-opacity="0"/></linearGradient>
          <linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#69B9D3"/><stop offset="1" stop-color="#8FD0EA"/></linearGradient>
          <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
          <g font-family="'Segoe UI',Helvetica,Arial,sans-serif"><rect x="1" y="1" width="{W-2}" height="{H-2}" rx="16" fill="#0D151C" stroke="#24394A" stroke-width="2"/>
          <text x="{L}" y="40" font-size="20" font-weight="700" fill="#69B9D3">Contribution Activity</text>
          <text x="{W-R}" y="40" font-size="14" fill="#91A0AD" text-anchor="end">{total} contributions in the last year</text>
          {grid}<path d="{area}" fill="url(#a)" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="1s" fill="freeze"/></path>
          <path d="{line}" fill="none" stroke="url(#l)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" filter="url(#g)"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="2.2s" fill="freeze"/></path>
          <circle r="5" fill="#fff" filter="url(#g)" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".1s" begin="2.3s" fill="freeze"/><animateMotion path="{line}" dur="6s" begin="2.3s" repeatCount="indefinite"/></circle>
          <circle cx="{bx:.1f}" cy="{by:.1f}" r="5" fill="#0D151C" stroke="#8FD0EA" stroke-width="2.5"><animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/></circle>
          <text x="{L}" y="{H-18}" font-size="12" fill="#91A0AD">1 year ago</text><text x="{W-R}" y="{H-18}" font-size="12" fill="#91A0AD" text-anchor="end">Today</text></g></svg>'''
          os.makedirs("dist", exist_ok=True)
          open("dist/activity-graph.svg", "w").write(svg)
          print("graph ok", total)
          PYEOF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
