name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: anshusingh-56
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#4f8fb0&color_dots=#e1e8ee,#b8d3e5,#8fbcd8,#69a4c9,#3f86b3
            dist/github-contribution-grid-snake-dark.svg?color_snake=#8FD0EA&color_dots=#16212b,#24394a,#35607a,#4f8fb0,#74b1d7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
